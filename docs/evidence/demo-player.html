<script>
const segments = [{"title":"The contract: who owns each field, and which writes are the integration's own","command":"node bin/csr contract --contract contract/sync-contract.json","lines":["Salesforce to ERP account and contact sync","  Salesforce integration user 005Kd000000SYNCAAA, changeOrigin client=SyncBridge: Every write the bridge applies into Salesforce commits as this user from a connected app whose changeOrigin ends in client=SyncBridge; a change event carrying either is the bridge echoing the ERP, not a Salesforce user deciding anything (ADR-002).","  ERP sync actor svc-sync-bridge: The bridge writes into the ERP as this service account; an audit entry by it is an echo of Salesforce, not an ERP user deciding anything.","  retention window 72 h: Change Data Capture keeps change events in the event bus for three days (high-volume platform events: 72 hours). A subscriber replaying from -2 sees nothing older, so the referee reads nothing older unless --window says an archive exists.","  clock skew tolerance 5 s: The two systems stamp writes with two clocks that are not the same clock. Two originating writes closer than this cannot be ordered by their timestamps and the referee says so instead of guessing (ADR-003). 5 s is a policy, not a measurement; ADR-005 says how to measure it.","  Account <-> accounts (joined on Id = sf_id)","    Name             salesforce  <-> name             trim               Sales renames accounts in Salesforce; the ERP displays the name and must never change it.","    Phone            shared      <-> phone            us_phone, empty_as_null Both teams correct phone numbers; the later correction wins. Compared on digits with a leading country code 1 dropped, because the ERP stores them unpunctuated and Salesforce users type +1.","    Industry         salesforce  <-> industry         trim               A Salesforce picklist maintained by marketing; the ERP mirrors the label.","    BillingCountry   shared      <-> billing_country  tr s":["Contact.Email on 003Kd0000000013AAA (as of 2026-11-10T00:00:00.000Z, window 72 h, skew 5 s)","  owner: shared","  Salesforce: keiko.dubois64@mail.example (normalised keiko.dubois64@mail.example)","  ERP: noor.rahman40@mail.example (normalised noor.rahman40@mail.example)","  writes in the window (3):","    2026-11-07T23:00:00.000Z  external    originating  u.farid               keiko.dubois64@mail.example  (audit aud-000077)","    2026-11-08T00:00:00.000Z  external    originating  u.esther              noor.rahman40@mail.example  (audit aud-000079)","    2026-11-08T09:00:00.000Z  salesforce  echo         005Kd000000SYNCAAA    keiko.dubois64@mail.example  (replayId 2000032, client=SyncBridge)","  verdict: Salesforce stale, cause echo of a stale value; overwrite salesforce with noor.rahman40@mail.example","  because: the field is shared, last originating write wins; the latest write on Salesforce is an echo by 005Kd000000SYNCAAA at 2026-11-08T09:00:00.000Z (replayId 2000032) = \"keiko.dubois64@mail.example\", which is the value the external system held at 2026-11-07T23:00:00.000Z (audit aud-000077) and no longer holds."],"exitCode":1,"replaySeconds":2.2},{"title":"The same run with a 30-day archive of change events instead of the 72-hour bus","command":"node bin/csr referee --salesforce fixture/salesforce --external fixture/external --contract contract/sync-contract.json --window 720h","lines":["crm-sync-referee: Salesforce to ERP account and contact sync; as of 2026-11-10T00:00:00.000Z, window 720 h (from 2026-10-11T00:00:00.000Z), clock skew tolerance 5 s","103 raw differences on 395 joined records; 18 normalise away; 85 real diffs: 30 blame ERP, 46 blame Salesforce, 9 no referee can attribute; 5 orphan records","window closed 2, within clock skew 4, sync transform 0, contract silent 2, gap event 1; causes: sync lag 39, rogue write 9, echo of a stale value 6, later write 16, sync transform 6, window closed 0","... (119 more lines)"],"exitCode":2,"replaySeconds":2.2},{"title":"The external side pulled over REST with a client-credentials token, paginated, backing off on 429","command":"node bin/csr pull --from http://127.0.0.1:34217 --client-id sf-sync-bridge --client-secret fixture-secret-not-a-secret --contract contract/sync-contract.json --out /tmp/csr-demo-erp --limit 20","lines":["pulled meta.json, accounts.json, contacts.json, audit.json into /tmp/csr-demo-erp: 32 requests, 30 pages, 1 token requests, 0 refreshes after 401, 1 retries after 429"],"exitCode":0,"replaySeconds":4.606796116},{"title":"The receipts: every figure in the docs checked against the code","command":"node tools/check_numbers.js","lines":["check_numbers: 138 metrics, 138 anchored, 8 documents plus the banner; 0 gaps, 0 stale, 0 missing, 0 unanchored"],"exitCode":0,"replaySeconds":2.2}];
const TYPE = 1.2, PAUSE = 2.6;
const term = document.getElementById("term");
const wrap = document.getElementById("wrap");
const sleep = (s) => new Promise((r) => setTimeout(r, s * 1000));
function add(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; wrap.appendChild(d); term.scrollTop = term.scrollHeight; return d; }
async function play() {
  await sleep(0.8);
  for (const seg of segments) {
    wrap.innerHTML = "";
    add("title", "# " + seg.title);
    add("", "");
    const line = add("cmdline", "");
    const prompt = document.createElement("span"); prompt.className = "prompt"; prompt.textContent = "$ "; line.appendChild(prompt);
    const cmd = document.createElement("span"); cmd.className = "cmd"; line.appendChild(cmd);
    const cursor = document.createElement("span"); cursor.id = "cursor"; line.appendChild(cursor);
    for (let i = 1; i <= seg.command.length; i += 1) { cmd.textContent = seg.command.slice(0, i); await sleep(TYPE / seg.command.length); }
    await sleep(0.35);
    cursor.remove();
    const per = seg.replaySeconds / Math.max(1, seg.lines.length);
    for (const l of seg.lines) { add("out", l); await sleep(per); }
    add("exit", "[exit " + seg.exitCode + "]");
    await sleep(PAUSE);
  }
  document.body.setAttribute("data-done", "1");
}
play();
</script></body></html>
